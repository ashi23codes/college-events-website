<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Upcoming Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎓 Campus Upcoming Events</h1>
        <p>Stay updated with all upcoming technical and cultural events!</p>
    </header>

    <main>
        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterEvents('all')">All Events</button>
            <button class="filter-btn" onclick="filterEvents('technical')">Technical</button>
            <button class="filter-btn" onclick="filterEvents('cultural')">Cultural</button>
            <button class="filter-btn" onclick="filterEvents('workshop')">Workshops</button>
        </div>

        <!-- Events Cards Container -->
        <div class="events-grid" id="eventsGrid">
            <!-- Events Javascript se yahan load honge -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 College Event Portal | Built with HTML, CSS & JS</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
